<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Places, Again Google Cloud architecture</title>
  <desc id="desc">A public Cloud Run API persists a validated incident and publishes an opaque event identifier. Pub/Sub uses OIDC to invoke a private Cloud Run worker. Gemini and Google ADK orchestrate narrow tools. A deterministic engine and safety gates either atomically commit Firestore state and a prepared outbox or escalate without mutation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0f"/><stop offset="1" stop-color="#18130e"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#969aa1"/></marker>
    <style>.title{font:700 42px Georgia,serif;fill:#f5f0e7}.sub{font:500 17px Inter,Arial,sans-serif;fill:#9d9b95}.label{font:800 18px Inter,Arial,sans-serif;fill:#f5f0e7}.small{font:500 13px Inter,Arial,sans-serif;fill:#a4a29c}.tiny{font:700 11px Inter,Arial,sans-serif;fill:#ffb08e;letter-spacing:.08em}.box{fill:#14171c;stroke:#343840;stroke-width:2}.google{fill:#111c29;stroke:#75a9ff;stroke-width:2}.safe{fill:#11241a;stroke:#70dfa0;stroke-width:2}.stop{fill:#2b1819;stroke:#ff7878;stroke-width:2}.line{fill:none;stroke:#969aa1;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="940" rx="24" fill="url(#bg)"/>
  <text x="65" y="70" class="title">Places, Again</text><text x="65" y="102" class="sub">Autonomous operational disruption recovery · Google Cloud evidence path</text>

  <text x="65" y="157" class="tiny">INGRESS + DURABLE RECEIVE</text>
  <rect x="65" y="185" width="210" height="108" rx="17" class="box"/><text x="170" y="228" text-anchor="middle" class="label">Event source</text><text x="170" y="257" text-anchor="middle" class="small">UI / API incident</text><text x="170" y="277" text-anchor="middle" class="small">strict Pydantic schema</text>
  <rect x="340" y="185" width="260" height="108" rx="17" class="google"/><text x="470" y="228" text-anchor="middle" class="label">Public Cloud Run API</text><text x="470" y="257" text-anchor="middle" class="small">persist first · return event_id</text><text x="470" y="277" text-anchor="middle" class="small">API service account</text>
  <rect x="665" y="185" width="240" height="108" rx="17" class="google"/><text x="785" y="228" text-anchor="middle" class="label">Google Pub/Sub</text><text x="785" y="257" text-anchor="middle" class="small">at-least-once delivery</text><text x="785" y="277" text-anchor="middle" class="small">opaque event_id only</text>
  <rect x="970" y="185" width="275" height="108" rx="17" class="google"/><text x="1107" y="228" text-anchor="middle" class="label">Private Cloud Run worker</text><text x="1107" y="257" text-anchor="middle" class="small">internal ingress + Pub/Sub OIDC</text><text x="1107" y="277" text-anchor="middle" class="small">worker service account</text>
  <rect x="1310" y="185" width="225" height="108" rx="17" class="google"/><text x="1422" y="228" text-anchor="middle" class="label">Gemini 3.5</text><text x="1422" y="257" text-anchor="middle" class="small">Vertex AI + Google ADK</text><text x="1422" y="277" text-anchor="middle" class="small">fixed event workflow</text>
  <path d="M275 239 H330" class="line"/><path d="M600 239 H655" class="line"/><path d="M905 239 H960" class="line"/><path d="M1245 239 H1300" class="line"/>

  <text x="65" y="374" class="tiny">ORCHESTRATION + DETERMINISTIC AUTHORITY</text>
  <rect x="1120" y="400" width="300" height="118" rx="17" class="box"/><text x="1270" y="441" text-anchor="middle" class="label">Explicit tool allowlist</text><text x="1270" y="470" text-anchor="middle" class="small">get context · execute event · status</text><text x="1270" y="491" text-anchor="middle" class="small">no shell · HTTP · secrets · send</text>
  <rect x="750" y="400" width="300" height="118" rx="17" class="box"/><text x="900" y="441" text-anchor="middle" class="label">Recovery engine</text><text x="900" y="470" text-anchor="middle" class="small">qualification · availability · people</text><text x="900" y="491" text-anchor="middle" class="small">resources · minimum change</text>
  <rect x="380" y="400" width="300" height="118" rx="17" class="safe"/><text x="530" y="441" text-anchor="middle" class="label">Deterministic safety gates</text><text x="530" y="470" text-anchor="middle" class="small">verification · unresolved · stale state</text><text x="530" y="491" text-anchor="middle" class="small">fail closed</text>
  <path d="M1422 293 V350 Q1422 390 1375 400" class="line"/><path d="M1120 459 H1060" class="line"/><path d="M750 459 H690" class="line"/>

  <text x="65" y="607" class="tiny">ATOMIC EFFECT OR HUMAN ESCALATION</text>
  <rect x="65" y="635" width="290" height="118" rx="17" class="stop"/><text x="210" y="678" text-anchor="middle" class="label">Human decision required</text><text x="210" y="707" text-anchor="middle" class="small">unsafe / unresolved / ambiguous</text><text x="210" y="728" text-anchor="middle" class="small">no commit · no outbox</text>
  <rect x="420" y="635" width="320" height="118" rx="17" class="safe"/><text x="580" y="676" text-anchor="middle" class="label">Firestore atomic state</text><text x="580" y="705" text-anchor="middle" class="small">ledger + plan + version + audit</text><text x="580" y="726" text-anchor="middle" class="small">exactly-once business effect</text>
  <rect x="805" y="635" width="300" height="118" rx="17" class="safe"/><text x="955" y="676" text-anchor="middle" class="label">Prepared outbox</text><text x="955" y="705" text-anchor="middle" class="small">deterministic message IDs</text><text x="955" y="726" text-anchor="middle" class="small">prepared_not_sent · zero sent</text>
  <rect x="1170" y="635" width="365" height="118" rx="17" class="box"/><text x="1352" y="676" text-anchor="middle" class="label">Observable evidence</text><text x="1352" y="705" text-anchor="middle" class="small">event/model/trace/versions/retries</text><text x="1352" y="726" text-anchor="middle" class="small">latency/tokens when available · no CoT</text>
  <path d="M470 518 C430 570 315 585 245 625" class="line"/><text x="335" y="568" class="small">fail</text>
  <path d="M560 518 V625" class="line"/><text x="575" y="574" class="small">pass + transaction</text>
  <path d="M740 694 H795" class="line"/><path d="M1105 694 H1160" class="line"/>
  <path d="M470 293 V330 Q470 350 510 350 H580 Q620 350 620 625" class="line"/><text x="486" y="342" class="small">incident ledger</text>

  <rect x="65" y="830" width="1470" height="55" rx="12" fill="#0d1014" stroke="#343840"/><text x="800" y="864" text-anchor="middle" class="sub">Autonomous where safety can be deterministically proved. Human-gated where ambiguity or irreversible external action remains.</text>
</svg>
