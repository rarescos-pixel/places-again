<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Places, Again system architecture</title>
  <desc id="desc">A production outage event reaches a Cloud Run web application. Gemini 3.5 orchestrates Google ADK tools, which call a deterministic recovery engine. Safety gates either stop for a human decision or atomically commit versioned state and prepare an unsent outbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0f"/><stop offset="1" stop-color="#17120d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c9a94"/></marker>
    <style>
      .title{font:700 42px Georgia,serif;fill:#f4f0e7}.sub{font:500 18px Inter,Arial,sans-serif;fill:#9c9a94}.label{font:800 18px Inter,Arial,sans-serif;fill:#f4f0e7}.small{font:500 14px Inter,Arial,sans-serif;fill:#9c9a94}.box{fill:#14171c;stroke:#34363d;stroke-width:2}.google{fill:#111c27;stroke:#78aaff}.safe{fill:#11241a;stroke:#6ddd9b}.stop{fill:#291719;stroke:#ff7777}.line{fill:none;stroke:#9c9a94;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" rx="24" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Places, Again</text><text x="70" y="108" class="sub">Auditable recovery after a same-day live-production disruption</text>

  <rect x="70" y="190" width="230" height="116" rx="18" class="box" filter="url(#shadow)"/><text x="185" y="238" text-anchor="middle" class="label">Production event</text><text x="185" y="270" text-anchor="middle" class="small">08:05 · person unavailable</text>
  <rect x="390" y="190" width="250" height="116" rx="18" class="google" filter="url(#shadow)"/><text x="515" y="232" text-anchor="middle" class="label">Cloud Run control room</text><text x="515" y="262" text-anchor="middle" class="small">FastAPI + web interface</text><text x="515" y="283" text-anchor="middle" class="small">version and runtime proof</text>
  <rect x="730" y="190" width="250" height="116" rx="18" class="google" filter="url(#shadow)"/><text x="855" y="232" text-anchor="middle" class="label">Gemini 3.5</text><text x="855" y="262" text-anchor="middle" class="small">Google ADK orchestrator</text><text x="855" y="283" text-anchor="middle" class="small">selects and sequences tools</text>
  <rect x="1070" y="190" width="300" height="116" rx="18" class="box" filter="url(#shadow)"/><text x="1220" y="232" text-anchor="middle" class="label">Scoped agent tools</text><text x="1220" y="262" text-anchor="middle" class="small">read · analyze · commit</text><text x="1220" y="283" text-anchor="middle" class="small">prepare outbox · inspect audit</text>

  <path d="M300 248 H380" class="line"/><path d="M640 248 H720" class="line"/><path d="M980 248 H1060" class="line"/>

  <rect x="1070" y="400" width="300" height="126" rx="18" class="box" filter="url(#shadow)"/><text x="1220" y="442" text-anchor="middle" class="label">Constraint engine</text><text x="1220" y="472" text-anchor="middle" class="small">skills · availability · people</text><text x="1220" y="493" text-anchor="middle" class="small">rooms · fixed-unaffected policy</text>
  <path d="M1220 306 V390" class="line"/>

  <rect x="730" y="405" width="250" height="116" rx="18" class="safe" filter="url(#shadow)"/><text x="855" y="447" text-anchor="middle" class="label">Safety gates</text><text x="855" y="477" text-anchor="middle" class="small">verification + stale-plan check</text><text x="855" y="498" text-anchor="middle" class="small">fail closed</text>
  <path d="M1070 463 H990" class="line"/>

  <rect x="390" y="388" width="250" height="100" rx="18" class="stop" filter="url(#shadow)"/><text x="515" y="430" text-anchor="middle" class="label">Human decision</text><text x="515" y="460" text-anchor="middle" class="small">unresolved plan is blocked</text>
  <path d="M730 438 H650" class="line"/><text x="690" y="425" text-anchor="middle" class="small">fail</text>

  <rect x="730" y="630" width="250" height="106" rx="18" class="safe" filter="url(#shadow)"/><text x="855" y="672" text-anchor="middle" class="label">Firestore state</text><text x="855" y="702" text-anchor="middle" class="small">atomic schedule + plans + audit</text>
  <rect x="1070" y="630" width="300" height="106" rx="18" class="safe" filter="url(#shadow)"/><text x="1220" y="672" text-anchor="middle" class="label">Prepared outbox</text><text x="1220" y="702" text-anchor="middle" class="small">Romanian + English · never sent</text>
  <path d="M855 521 V620" class="line"/><text x="875" y="574" class="small">pass + commit</text><path d="M980 683 H1060" class="line"/>
  <path d="M730 683 C590 683 515 600 515 498" class="line"/><text x="598" y="650" class="small">visible result</text>
</svg>
