<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Places, Again bounded-agent Google Cloud architecture</title>
  <desc id="desc">A public Cloud Run API persists an incident and publishes its opaque ID. Authenticated Pub/Sub invokes a private worker. Deterministic code creates safe candidates, Gemini selects one ID using soft priorities, deterministic code re-verifies it, and Firestore either commits one atomic effect or records a human escalation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0f"/><stop offset="1" stop-color="#18130e"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#969aa1"/></marker>
    <style>.title{font:700 42px Georgia,serif;fill:#f5f0e7}.sub{font:500 17px Inter,Arial,sans-serif;fill:#9d9b95}.label{font:800 18px Inter,Arial,sans-serif;fill:#f5f0e7}.small{font:500 13px Inter,Arial,sans-serif;fill:#a4a29c}.tiny{font:700 11px Inter,Arial,sans-serif;fill:#ffb08e;letter-spacing:.08em}.box{fill:#14171c;stroke:#343840;stroke-width:2}.google{fill:#111c29;stroke:#75a9ff;stroke-width:2}.safe{fill:#11241a;stroke:#70dfa0;stroke-width:2}.choice{fill:#1a1830;stroke:#a88dff;stroke-width:2}.stop{fill:#2b1819;stroke:#ff7878;stroke-width:2}.line{fill:none;stroke:#969aa1;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="1000" rx="24" fill="url(#bg)"/>
  <text x="65" y="70" class="title">Places, Again</text><text x="65" y="102" class="sub">Gemini decides what makes operational sense. Deterministic code proves what is safe.</text>

  <text x="65" y="157" class="tiny">EVENT-DRIVEN GOOGLE CLOUD PATH</text>
  <rect x="65" y="185" width="240" height="112" rx="17" class="box"/><text x="185" y="227" text-anchor="middle" class="label">Disruption source</text><text x="185" y="256" text-anchor="middle" class="small">UI / API · strict schema</text><text x="185" y="278" text-anchor="middle" class="small">one person unavailable</text>
  <rect x="400" y="185" width="285" height="112" rx="17" class="google"/><text x="542" y="227" text-anchor="middle" class="label">Public Cloud Run API</text><text x="542" y="256" text-anchor="middle" class="small">persist first · return event_id</text><text x="542" y="278" text-anchor="middle" class="small">no Gemini · no commit authority</text>
  <rect x="780" y="185" width="250" height="112" rx="17" class="google"/><text x="905" y="227" text-anchor="middle" class="label">Google Pub/Sub</text><text x="905" y="256" text-anchor="middle" class="small">at-least-once delivery</text><text x="905" y="278" text-anchor="middle" class="small">opaque event_id only</text>
  <rect x="1125" y="185" width="410" height="112" rx="17" class="google"/><text x="1330" y="227" text-anchor="middle" class="label">Private Cloud Run worker</text><text x="1330" y="256" text-anchor="middle" class="small">Pub/Sub OIDC · internal ingress</text><text x="1330" y="278" text-anchor="middle" class="small">Google ADK + Vertex AI workload identity</text>
  <path d="M305 241 H390" class="line"/><path d="M685 241 H770" class="line"/><path d="M1030 241 H1115" class="line"/>

  <text x="65" y="380" class="tiny">BOUNDED AGENT DECISION</text>
  <rect x="120" y="410" width="390" height="142" rx="18" class="safe"/><text x="315" y="450" text-anchor="middle" class="label">Deterministic feasible space</text><text x="315" y="479" text-anchor="middle" class="small">qualification · availability · people</text><text x="315" y="501" text-anchor="middle" class="small">resources · duration · current version</text><text x="315" y="528" text-anchor="middle" class="tiny">RETURNS 1–5 SAFE CANDIDATE IDs</text>
  <rect x="605" y="410" width="390" height="142" rx="18" class="choice"/><text x="800" y="450" text-anchor="middle" class="label">Gemini 3.5 + Google ADK</text><text x="800" y="479" text-anchor="middle" class="small">compare visible soft trade-offs</text><text x="800" y="501" text-anchor="middle" class="small">select candidate_id + reason codes</text><text x="800" y="528" text-anchor="middle" class="tiny">CANNOT INVENT OR EDIT A PLAN</text>
  <rect x="1090" y="410" width="390" height="142" rx="18" class="safe"/><text x="1285" y="450" text-anchor="middle" class="label">Deterministic re-verification</text><text x="1285" y="479" text-anchor="middle" class="small">ID membership · state freshness · skills</text><text x="1285" y="501" text-anchor="middle" class="small">duration · conflicts · complete affected set</text><text x="1285" y="528" text-anchor="middle" class="tiny">PASS OR FAIL CLOSED</text>
  <path d="M1330 297 V350 Q1330 380 1245 410" class="line"/><path d="M510 481 H595" class="line"/><path d="M995 481 H1080" class="line"/>

  <text x="65" y="650" class="tiny">ONE ATOMIC BUSINESS EFFECT</text>
  <rect x="65" y="680" width="315" height="130" rx="18" class="stop"/><text x="222" y="724" text-anchor="middle" class="label">Human decision required</text><text x="222" y="754" text-anchor="middle" class="small">no safe candidate / invalid ID</text><text x="222" y="776" text-anchor="middle" class="small">no version change · no outbox</text>
  <rect x="455" y="680" width="330" height="130" rx="18" class="safe"/><text x="620" y="724" text-anchor="middle" class="label">Firestore transaction</text><text x="620" y="754" text-anchor="middle" class="small">event ledger + selected plan + version</text><text x="620" y="776" text-anchor="middle" class="small">audit + deterministic outbox IDs</text>
  <rect x="860" y="680" width="290" height="130" rx="18" class="safe"/><text x="1005" y="724" text-anchor="middle" class="label">Prepared outbox</text><text x="1005" y="754" text-anchor="middle" class="small">bilingual call sheets</text><text x="1005" y="776" text-anchor="middle" class="small">prepared_not_sent · zero sent</text>
  <rect x="1225" y="680" width="310" height="130" rx="18" class="box"/><text x="1380" y="724" text-anchor="middle" class="label">Observable evidence</text><text x="1380" y="754" text-anchor="middle" class="small">candidate set · chosen ID · reasons</text><text x="1380" y="776" text-anchor="middle" class="small">trace · versions · retries · no CoT</text>
  <path d="M1225 552 C1050 610 500 610 270 670" class="line"/><text x="750" y="607" class="small">fail</text>
  <path d="M1285 552 V620 Q1285 650 780 680" class="line"/><text x="1120" y="620" class="small">pass + atomic commit</text>
  <path d="M785 745 H850" class="line"/><path d="M1150 745 H1215" class="line"/>
  <path d="M542 297 V635 Q542 655 580 680" class="line"/><text x="555" y="620" class="small">durable event ledger</text>

  <rect x="65" y="890" width="1470" height="58" rx="12" fill="#0d1014" stroke="#343840"/><text x="800" y="925" text-anchor="middle" class="sub">No shell · no arbitrary HTTP · no service-account keys · no direct LLM database mutation · no send capability</text>
</svg>
