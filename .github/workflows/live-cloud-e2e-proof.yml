name: Live Cloud E2E Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-cloud-e2e-proof.yml'

permissions:
  contents: read

concurrency:
  group: live-cloud-e2e-proof
  cancel-in-progress: false

jobs:
  prove-live-cloud-path:
    name: Public app to real Gemini/ADK/Firestore proof
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HASH_URL: https://places-again-inb6leu4ca-ew.a.run.app
      DETERMINISTIC_URL: https://places-again-618104708054.europe-west1.run.app

    steps:
      - name: Checkout submitted repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve externally reachable Cloud Run URL
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          candidates = [os.environ['HASH_URL'], os.environ['DETERMINISTIC_URL']]
          failures = []
          selected = None
          for base in candidates:
              url = base.rstrip('/') + '/api/capabilities'
              try:
                  with urlopen(url, timeout=30) as response:
                      body = response.read()
                      code = response.status
                  payload = json.loads(body)
                  if (
                      code == 200
                      and payload.get('runtime') == 'Google Cloud Run'
                      and payload.get('repository') == 'firestore'
                      and payload.get('event_transport') == 'Google Pub/Sub'
                  ):
                      selected = base.rstrip('/')
                      print(f'PUBLIC_ENDPOINT_OK={selected}')
                      print(json.dumps(payload, indent=2))
                      break
                  failures.append(f'{base}: unexpected payload/status {code} {payload!r}')
              except HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  failures.append(f'{base}: HTTP {error.code}: {body[:500]}')
              except (URLError, TimeoutError, json.JSONDecodeError) as error:
                  failures.append(f'{base}: {type(error).__name__}: {error}')

          if not selected:
              raise AssertionError('No public Cloud Run URL was reachable:\n' + '\n'.join(failures))

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'PLACES_AGAIN_LIVE_URL={selected}\n')
          PY

      - name: Confirm public capabilities endpoint
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          import os

          url = os.environ['PLACES_AGAIN_LIVE_URL'].rstrip('/') + '/api/capabilities'
          with urlopen(url, timeout=30) as response:
              payload = json.loads(response.read())
          assert payload['runtime'] == 'Google Cloud Run', payload
          assert payload['repository'] == 'firestore', payload
          assert payload['event_transport'] == 'Google Pub/Sub', payload
          assert payload['synthetic_demo_reset_enabled'] is True, payload
          print(json.dumps(payload, indent=2))
          PY

      - name: Run independent live Cloud E2E
        run: |
          mkdir -p runtime
          python scripts/cloud_e2e_test.py "$PLACES_AGAIN_LIVE_URL" \
            --output "runtime/cloud-e2e-github-${GITHUB_SHA}.json"

      - name: Publish raw live Cloud evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-cloud-e2e-${{ github.sha }}
          path: runtime/cloud-e2e-github-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
