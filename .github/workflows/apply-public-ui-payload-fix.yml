name: Apply Public UI Payload Fix

on:
  push:
    branches: [fix-public-ui-payload]
    paths:
      - '.github/workflows/apply-public-ui-payload-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-public-ui-payload
          fetch-depth: 0
      - name: Remove presentation-only copy field from API payload
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/index.html')
          text = path.read_text(encoding='utf-8')
          old = "pendingIncident={scenario_id:scenario,event_id:crypto.randomUUID(),source:'demo',disruption:configs[scenario]};"
          new = "const {copy,...disruption}=configs[scenario];pendingIncident={scenario_id:scenario,event_id:crypto.randomUUID(),source:'demo',disruption};"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy payload construction, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_ui_incident_payload.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_demo_ui_does_not_send_presentation_copy_in_disruption_payload():\n    html = Path("static/index.html").read_text(encoding="utf-8")\n    assert "disruption:configs[scenario]" not in html\n    assert "const {copy,...disruption}=configs[scenario]" in html\n    assert "disruption};" in html\n''', encoding='utf-8')
          PY
      - name: Verify focused regression
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ui_incident_payload.py
      - name: Remove temporary workflow and commit only product fix
        run: |
          git rm .github/workflows/apply-public-ui-payload-fix.yml
          git add static/index.html tests/test_ui_incident_payload.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix public demo incident payload"
          git push origin HEAD:fix-public-ui-payload
