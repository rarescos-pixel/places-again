name: Publish Hackathon Build Article

on:
  push:
    branches: [submission-video-automation]
    paths:
      - 'docs/build-article.md'
      - '.github/workflows/publish-build-article.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public article
        run: |
          python -m pip install markdown
          mkdir -p _site
          python - <<'PY'
          from pathlib import Path
          import html
          import markdown

          source = Path('docs/build-article.md').read_text(encoding='utf-8')
          body = markdown.markdown(source, extensions=['fenced_code', 'tables'])
          page = f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Building Places, Again</title>
          <meta name="description" content="How Places, Again was built for the Google All Things Agentic Hackathon.">
          <style>
          :root{{color-scheme:dark}}body{{margin:0;background:#0b0d11;color:#eee9df;font:18px/1.65 system-ui,-apple-system,sans-serif}}
          main{{max-width:900px;margin:auto;padding:52px 24px 90px}}h1,h2{{line-height:1.15}}h1{{font-size:clamp(2.6rem,7vw,5.2rem)}}h2{{margin-top:2.2em;color:#ff8a5b}}
          a{{color:#8ab4ff}}blockquote{{border-left:3px solid #ff7947;margin-left:0;padding-left:20px;color:#c9c4bb}}
          code{{background:#171a20;padding:.15em .35em;border-radius:5px}}pre{{background:#111419;padding:18px;overflow:auto;border-radius:10px}}
          ul,ol{{padding-left:1.4em}}strong{{color:#fff}}.top{{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:#ff8a5b;font-weight:800}}
          </style></head><body><main><div class="top">Google All Things Agentic Hackathon · Public build article</div>{body}</main></body></html>'''
          Path('_site/index.html').write_text(page, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
